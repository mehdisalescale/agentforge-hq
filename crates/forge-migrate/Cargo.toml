[package]
name = "forge-migrate"
version = "0.1.0"
edition = "2021"

[dependencies]
forge-core = { path = "../forge-core" }
forge-git = { path = "../forge-git" }
forge-process = { path = "../forge-process" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tokio = { version = "1", features = ["process", "io-util", "sync", "rt"] }
uuid = { workspace = true }
chrono = { workspace = true }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros"] }
